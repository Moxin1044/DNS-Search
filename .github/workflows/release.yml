name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: windows
            goarch: amd64
            extension: .exe
          - goos: windows
            goarch: arm64
            extension: .exe
          - goos: linux
            goarch: amd64
            extension: ''
          - goos: linux
            goarch: arm64
            extension: ''
          - goos: darwin
            goarch: amd64
            extension: ''
          - goos: darwin
            goarch: arm64
            extension: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags='-s -w' -o "dist/dns-search-${GOOS}-${GOARCH}${{ matrix.extension }}" .
      - uses: actions/upload-artifact@v4
        with:
          name: dns-search-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Package artifacts
        run: |
          cd dist
          for file in *; do
            if [[ "$file" == *.exe ]]; then
              zip "${file%.exe}.zip" "$file"
            else
              tar -czf "$file.tar.gz" "$file"
            fi
          done
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.tar.gz --repo "${GITHUB_REPOSITORY}" --generate-notes --title "DNS-Search ${GITHUB_REF_NAME}"
